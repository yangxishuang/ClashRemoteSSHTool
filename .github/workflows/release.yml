name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build self-contained release
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            ## Clash-Remote-SSH v0.8.0

            ClashSSH遥控台是一款 Windows 图形化 SSH 遥控工具，用于管理 Linux 服务器上的 mihomo，也支持为尚未部署服务的主机完成初始安装。

            ### 本版本更新

            - 配置页支持一键刷新全部链接订阅。
            - 活动订阅最后处理，并在更新前提示代理服务将重启。
            - 更新后回读节点数量、流量余量和到期时间。
            - 单个订阅下载失败时继续处理其他订阅。
            - 远端写入状态不确定时停止后续操作并回读实际状态。
            - 优化项目名称、图标和连接记录兼容性。

            ### 主要功能

            - 系统 OpenSSH 密钥登录及 SSH 账号密码登录。
            - 使用 Windows DPAPI 加密保存成功连接的 SSH 密码。
            - 规则、全局、直连模式切换，节点切换及延迟测试。
            - 订阅链接和本机 YAML 导入、切换、更新、重命名及删除。
            - 服务启停、重启、卸载、系统代理及远端 TUN 控制。
            - 自动部署 mihomo；在线源不可用时使用内置 v1.19.31 内核及规则数据。

            ### 下载与运行

            下载 `Clash-Remote-SSH.exe` 后直接运行，无需额外安装 .NET。系统 SSH 模式依赖 Windows OpenSSH，密码模式使用内置 SSH.NET。

            建议同时下载 `SHA256SUMS.txt` 并核对文件完整性。程序暂未签名，Windows 可能显示 SmartScreen 提示。

            ### 注意事项

            - 支持 Windows x64。
            - 自动部署支持 Linux amd64/arm64 和 systemd 用户服务。
            - 服务切换、订阅更新及 TUN 操作可能中断现有代理连接。
            - 暂不支持规则编辑、多订阅合并、后台定时更新和多主机集中管理。
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($notesPath, $env:RELEASE_NOTES, [System.Text.UTF8Encoding]::new($false))

          $assets = @(Get-ChildItem -LiteralPath artifacts -Recurse -File | Sort-Object FullName | ForEach-Object FullName)
          if ($assets.Count -eq 0) {
              throw "No release assets were produced."
          }

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title "Clash-Remote-SSH $env:GITHUB_REF_NAME" --notes-file $notesPath --latest
              if ($LASTEXITCODE -ne 0) { throw "Updating the release failed." }
              gh release upload $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) { throw "Uploading release assets failed." }
          } else {
              $arguments = @("release", "create", $env:GITHUB_REF_NAME)
              $arguments += $assets
              $arguments += @("--repo", $env:GITHUB_REPOSITORY, "--title", "Clash-Remote-SSH $env:GITHUB_REF_NAME", "--notes-file", $notesPath, "--verify-tag", "--latest")
              & gh @arguments
              if ($LASTEXITCODE -ne 0) { throw "Creating the release failed." }
          }
